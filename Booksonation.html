<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book donation form</title>
</head>
<body>
    <header>
       <h1>Book donation form</h1> 
    </header>
    <form>
        <fieldset>
            <legend>Personal details</legend>
            <label for="">Enter your full name:</label>
            <br>
            <input type="text" name="" id="">
            <label for=""></label>
            <br>
            <br>
            <label for="">Donor Library ID</label>
            <br>
            <input type="password">
            <br>
            <br>
            <label for="">Donation date</label>
            <input type="date" name="" id="">        
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Book information</legend>
            <br><label for="">Book Name</label>
            <br>
            <input type="text" name="" id="">
            <br><br>
            <label for="">Author</label>
            <br>
            <input type=""text>
            <br><br>
            <label for="">Genre</label>
            <br>
            <input type="radio" name="" id="">Sci-Fi
            <br>
            <input type="radio" name="" id="">Horror
            <br>
            <input type="radio" name="" id="">Fantasy
            <br>
            <input type="radio" name="" id="">Action
            <br>
            <input type="radio" name="" id="">Mystery/crime
            <br>
            <input type="radio" name="" id="">Other
            <input type="text" name="" id="">
            <br><br>
            <label for="">Condition</label>
            <br>
            <textarea name="" id="" placeholder="Describe condidtion"></textarea>
            <br>

        </fieldset>
        <br><br>
        <fieldset>
            <label for="">Extra information</label>
            <br>
            <textarea name="" id="" cols="60" rows="5" placeholder="Any extra information?"></textarea>
        </fieldset>
        <br>
        <input type="submit" value="Confirm donation">
    </form>
</body>
</html>
